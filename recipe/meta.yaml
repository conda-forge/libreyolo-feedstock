{% set name = "libreyolo" %}
{% set version = "1.7.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 05bd11237ef6f6e1818c7581404a8a9b357de23816802ff0aabe1813bfc4139f

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - libreyolo = libreyolo.cli:entrypoint

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - wheel
  run:
    - python >={{ python_min }}
    - numpy >=1.19.0
    - pillow >=9.1.0
    - pytorch >=2.4.0
    - torchvision >=0.19.0
    - pyyaml >=6.0
    - requests >=2.25.0
    - opencv >=4.11.0
    - python-mss >=9.0.1
    - tqdm >=4.65.0
    - pycocotools >=2.0.0
    - typer >=0.9.0
    - click >=8.0.0
    - safetensors >=0.4.0
    - scipy >=1.7.0
    - cloudpickle >=3.0.0

test:
  imports:
    - libreyolo
  commands:
    - pip check
    - libreyolo --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/LibreYOLO/libreyolo
  summary: MIT-licensed YOLO library for training and inference
  description: |
    LibreYOLO is an MIT-licensed object detection library with training and
    inference support across YOLOv9, YOLOX, YOLO-NAS, RF-DETR, D-FINE, and
    RT-DETR. ONNX is the release-blocking export target; TorchScript,
    TensorRT, OpenVINO, and NCNN are supported as experimental backends.
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - NOTICE
    - THIRD_PARTY_NOTICES.txt
  doc_url: https://www.libreyolo.com/docs
  dev_url: https://github.com/LibreYOLO/libreyolo

extra:
  recipe-maintainers:
    - EHxuban11
